name: Android R1 build
on:
  push:
    paths: ['android-r1/**', '.github/workflows/android-r1-build.yml']
  pull_request:
    paths: ['android-r1/**', '.github/workflows/android-r1-build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-33' 'build-tools;33.0.2' 'ndk;25.2.9519653' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '7.6.4' }
      - name: Bootstrap pinned native dependencies
        run: bash android-r1/scripts/bootstrap-native.sh
      - name: Build debug APK
        working-directory: android-r1
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: voice-satellite-r1-debug
          path: android-r1/app/build/outputs/apk/debug/app-debug.apk
