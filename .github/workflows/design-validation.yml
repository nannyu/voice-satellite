name: Design validation
on:
  push:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'tools/stock-frontend/**'
      - '.github/workflows/design-validation.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'tools/stock-frontend/**'
      - '.github/workflows/design-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Validate stock Agent bridge bundle
        run: python3 docs/stock-agent-bridge/validate_design.py
      - name: Run validator counterexample tests
        run: python3 docs/stock-agent-bridge/test_validate_design.py -v
      - name: Test read-only stock inventory helpers
        working-directory: tools/stock-frontend
        run: python3 -m unittest -v test_stock_frontend_inventory.py
